<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups - Festival Social</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Festival Social</div>
    <nav class="site-nav">
      <ul id="navLinks"></ul>
    </nav>
  </header>

  <div class="toast" id="toast"></div>

  <main class="top-align">
    <div class="page-container">

      <section class="card-flat">
        <h2>Create a Group</h2>
        <p class="error-message" id="createError"></p>
        <form id="createGroupForm" class="inline-form">
          <div class="field">
            <label for="groupName">Name</label>
            <input type="text" id="groupName" required minlength="3" maxlength="20" placeholder="Techno Nights">
          </div>
          <div class="field">
            <label for="groupCategory">Category</label>
            <input type="text" id="groupCategory" required maxlength="30" placeholder="genre, travel, ...">
          </div>
          <div class="field">
            <label for="groupDescription">Description</label>
            <input type="text" id="groupDescription" maxlength="500" placeholder="Optional">
          </div>
          <button type="submit" class="primary-btn btn-small">Create</button>
        </form>
      </section>

      <section class="card-flat">
  <h2>Browse Groups</h2>
  <div class="filters">
    <div class="field">
      <label for="filterName">Search by name</label>
      <input type="text" id="filterName" placeholder="e.g. Techno Nights">
    </div>
    <div class="field">
      <label for="filterCategory">Category</label>
      <input type="text" id="filterCategory" placeholder="e.g. genre, travel">
    </div>
    <div class="field">
      <label for="filterSortBy">Sort by</label>
      <select id="filterSortBy">
        <option value="recent">Recently added</option>
        <option value="popular">Most popular</option>
      </select>
    </div>
    <button id="searchBtn" class="primary-btn btn-small">Search</button>
  </div>
</section>

      <section>
        <h2>My Groups</h2>
        <div class="groups-grid" id="myGroupsGrid"></div>
      </section>

      <section>
        <h2>Discover Groups</h2>
        <div class="groups-grid" id="allGroupsGrid"></div>
      </section>

      <div id="editGroupModal" class="users-modal" hidden>
        <div class="users-modal-content">

          <div class="users-modal-header">
            <h2>Edit Group</h2>
            <button type="button" id="closeEditGroupModalBtn">&times;</button>
          </div>

          <p class="error-message" id="editGroupError"></p>

          <form id="editGroupForm">
            <div class="field">
              <label for="editGroupName">Name</label>
              <input type="text" id="editGroupName" required minlength="3" maxlength="20">
            </div>
            <div class="field">
              <label for="editGroupCategory">Category</label>
              <input type="text" id="editGroupCategory" required maxlength="30">
            </div>
            <div class="field">
              <label for="editGroupDescription">Description</label>
              <input type="text" id="editGroupDescription" maxlength="500">
            </div>
            <button type="submit" class="primary-btn btn-small">Save Changes</button>
          </form>

          <h3 style="margin-top:1.5rem;">Members</h3>
          <div id="editGroupMembersList" class="users-list"></div>

        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    Festival Social &mdash; Internet Application Development course project
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/groups.js"></script>
</body>
</html>
