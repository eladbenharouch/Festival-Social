<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post - Festival Social</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="logo">Festival Social</div>

    <nav class="site-nav">
      <ul id="navLinks"></ul>
    </nav>
  </header>

  <div class="toast" id="toast"></div>

  <main class="top-align">
    <div class="page-container">

      <section>
        <button
          type="button"
          id="backBtn"
          class="btn-small btn-outline">
          ← Back
        </button>
      </section>

      <section
        id="postContainer"
        class="card-flat">

        <p>Loading post...</p>

      </section>

    </div>
  </main>

  <footer class="site-footer">
    Festival Social &mdash; Internet Application Development course project
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/post.js"></script>

</body>
</html>
